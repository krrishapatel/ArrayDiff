name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares, so the claim gets tested.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, so a new ruff release cannot turn this red without a change
      # here. The rule set is pinned in pyproject for the same reason.
      - run: pip install ruff==0.15.20
      - run: ruff check .

  sweep:
    # The point of this job: run the real differential sweep against real torch
    # and jax builds, so the README's finding counts and known.py's suppressions
    # are tested rather than trusted. This runs on x86 with no GPU, so the CPU
    # findings are checked here and the MPS ones skip; between this and a local
    # run on Apple Silicon both halves of the table get covered. It is separate
    # from `test` because installing torch and jax is heavier and slower, and a
    # pure-numpy unit-test failure should not wait on it.
    name: Differential sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # CPU builds only; the sweep forces torch onto CPU regardless, and jax is
      # CPU here. Versions are unpinned so the sweep tracks current releases and
      # goes red when one of the pinned bugs is fixed, which is the job's whole
      # purpose.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "jax[cpu]"
      - run: pytest -q tests/test_sweep_ci.py
