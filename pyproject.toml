[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arraydiff"
version = "0.1.0"
description = "Differential numerical testing for array libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# mpmath supplies the exactly-rounded reference used for ULP measurement.
exact = ["mpmath>=1.3"]
dev = ["pytest>=7", "mpmath>=1.3"]

[project.scripts]
arraydiff = "arraydiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arraydiff"]
