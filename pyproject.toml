[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arraydiff"
version = "0.1.0"
description = "Differential numerical testing for array libraries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# mpmath supplies the exactly-rounded reference used for ULP measurement.
exact = ["mpmath>=1.3"]
dev = ["pytest>=7", "mpmath>=1.3"]

[project.scripts]
arraydiff = "arraydiff.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arraydiff"]

# Ruff's own default rule set: the pycodestyle errors that indicate a real
# problem, plus all of pyflakes. Named explicitly so a new ruff release cannot
# widen it and turn CI red without a code change. The wider style rules are
# deliberately left out: they would mean reformatting every file to change no
# behaviour, and the useful part of linting here was pyflakes, which found dead
# code and an undefined name.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
